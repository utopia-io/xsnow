stages:
  - lint
  - standard-install
  - gpu-install
  - docs

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - when: never

variables:
  PIP_CACHE_DIR: ".cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  before_script:
    - python -V
    - python -m pip install --upgrade pip
    - pip --version
  cache:
    key: "${CI_JOB_NAME}-py${CI_IMAGE_TAG:-3.12}"
    paths:
      - .cache/pip
    policy: pull-push

########################################
# Lint (manual, non-blocking)
########################################
type-mypy:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - mypy src/xsnow
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ .mypy_cache/ ]

lint-flake8:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - flake8 src tests

lint-pylint:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - pylint src/xsnow

########################################
# CPU tests (always)
########################################
tests-cpu:
  stage: standard-install
  script:
    - pip install -e ".[testing]"
    - pytest -q --maxfail=1 --disable-warnings --junitxml=pytest-junit.xml --cov=xsnow --cov-report=xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

########################################
# GPU tests (manual, non-blocking)
########################################
tests-gpu:
  stage: gpu-install
  tags: ["gpu"]   # requires a runner with this tag
  image: nvidia/cuda:12.4.1-runtime-ubuntu22.04
  before_script:
    - apt-get update && apt-get install -y python3-pip python3-venv && rm -rf /var/lib/apt/lists/*
    - python3 -V
    - python3 -m pip install --upgrade pip
    - pip --version
  variables:
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    PIP_CACHE_DIR: ".cache/pip"
  cache:
    key: "${CI_JOB_NAME}"
    paths: [ .cache/pip ]
    policy: pull-push
  script:
    - pip install -e ".[gpu,testing]"
    - pytest -q -m "not slow" --maxfail=1 --disable-warnings --junitxml=pytest-gpu.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-gpu.xml
  rules: [ { when: manual } ]
  allow_failure: true

########################################
# Docs (versioned GitLab Pages)
########################################
.default-docs: &default-docs
  image: python:3.12-slim
  stage: docs
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - pip install -e .
  cache:
    key: "pip-docs"
    paths: [ .cache/pip ]
    policy: pull-push
  artifacts:
    paths: [ public ]
    expire_in: 360 days

# Default branch → /latest/
docs-latest:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    - sphinx-apidoc -f -e -o docs/api src/xsnow
    - jupyter-book build docs --path-output docs/_build
    - mkdir -p public/latest
    - cp -r docs/_build/_build/html/* public/latest/
    - |
      cat > public/index.html <<'HTML'
      <!doctype html><meta charset="utf-8">
      <meta http-equiv="refresh" content="0; url=./latest/">
      <link rel="canonical" href="./latest/">
      <title>Redirecting…</title>
      <p>Docs are at <a href="./latest/">latest/</a></p>
      HTML

# Tags → /<tag>/
docs-tagged:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  script:
    - sphinx-apidoc -f -e -o docs/api src/xsnow
    - jupyter-book build docs --path-output docs/_build
    - mkdir -p "public/${CI_COMMIT_TAG}"
    - cp -r docs/_build/_build/html/* "public/${CI_COMMIT_TAG}/"
    - |
      if [ ! -f public/index.html ]; then
        cat > public/index.html <<'HTML'
        <!doctype html><meta charset="utf-8">
        <title>xsnow docs</title>
        <h1>xsnow documentation</h1>
        <ul>
          <li><a href="./latest/">latest</a></li>
        </ul>
        HTML
      fi
      sed -i "s#</ul>#  <li><a href=\"./${CI_COMMIT_TAG}/\">${CI_COMMIT_TAG}</a></li>\n</ul>#g" public/index.html

pages:
  stage: docs
  needs:
    - job: docs-latest
      optional: true
    - job: docs-tagged
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  script:
    - echo "Publishing GitLab Pages artifacts"
  artifacts:
    paths: [ public ]
