########################################
# Root Pages deployment -> /
########################################
pages-root:
  stage: docs
  script:
    - rm -rf public
    - mkdir -p public/versionpicker
    - |
      printf '%s\n' \
        '<!doctype html>' \
        '<meta charset="utf-8">' \
        '<meta http-equiv="refresh" content="0; url=./stable/">' \
        '<link rel="canonical" href="./stable/">' \
        '<title>Redirecting...</title>' \
        '<p>Redirecting to <a href="./stable/">stable</a> docs...</p>' \
        '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
        > public/index.html
    - |
      {
        echo '<!doctype html><meta charset="utf-8">';
        echo '<title>xsnow documentation versions</title>';
        echo '<h1>xsnow documentation versions</h1>';
        echo '<ul>';
        echo '  <li><a href="../stable/">stable</a> (default)</li>';
        echo '  <li><a href="../dev/">dev</a> (bleeding edge)</li>';
        for tag in $(git tag --sort=-v:refname); do
          prefix=$(printf '%s' "$tag" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9.]/-/g' -e 's/^[.-]*//' \
            | cut -b1-63 \
            | sed -e 's/[.-]*$//')
          if [ -n "$prefix" ]; then
            echo "  <li><a href=\"../${prefix}/\">${tag}</a></li>";
          fi
        done
        echo '</ul>';
        echo '<p>Tip: You can directly visit /stable/, /dev/, or a tagged release such as /v0.1.0/.</p>';
      } > public/versionpicker/index.html
  pages:
    publish: public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never

########################################
# Docs from default branch  -> /stable/
########################################
pages-stable:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    - export XSNOW_VERSION=$(python -c "import xsnow; print(xsnow.__version__)")
    - export DOC_LABEL="stable (${XSNOW_VERSION})"
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true
    - echo "Generating API docs…"
    - rm -rf docs/api/_generated || true
    - mkdir -p docs/api/_generated
    - sphinx-apidoc -f -e -o docs/api/_generated src/xsnow
    - sed -i '1s/^xsnow\.extensions\.//' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.io\./io./' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.//' docs/api/_generated/*.rst || true
    - sed -i '/^Submodules$/,/^Module contents$/ { /^Module contents$/!d; }' docs/api/_generated/xsnow.io.rst || true
    - sed -i '/^Module contents$/,+2d' docs/api/_generated/xsnow.io.rst || true
    - jupyter-book build docs
    - rm -rf public
    - mkdir -p public
    - cp -a docs/_build/html/. public/
  pages:
    publish: public
    path_prefix: stable
    expire_in: never

########################################
# Docs from dev branch -> /dev/
########################################
pages-dev:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
  allow_failure: true
  script:
    - export XSNOW_VERSION=$(python -c "import xsnow; print(xsnow.__version__)")
    - export DOC_LABEL="dev (${XSNOW_VERSION})"
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true
    - echo "Generating API docs…"
    - rm -rf docs/api/_generated || true
    - mkdir -p docs/api/_generated
    - sphinx-apidoc -f -e -o docs/api/_generated src/xsnow
    - sed -i '1s/^xsnow\.extensions\.//' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.io\./io./' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.//' docs/api/_generated/*.rst || true
    - sed -i '/^Submodules$/,/^Module contents$/ { /^Module contents$/!d; }' docs/api/_generated/xsnow.io.rst || true
    - sed -i '/^Module contents$/,+2d' docs/api/_generated/xsnow.io.rst || true
    - jupyter-book build docs
    - rm -rf public
    - mkdir -p public
    - cp -a docs/_build/html/. public/
  pages:
    publish: public
    path_prefix: dev
    expire_in: never

########################################
# Docs from git tag (release) -> /<tag>/
########################################
pages-tagged:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  script:
    - export DOC_LABEL="${CI_COMMIT_TAG}"
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true
    - echo "Generating API docs…"
    - rm -rf docs/api/_generated || true
    - mkdir -p docs/api/_generated
    - sphinx-apidoc -f -e -o docs/api/_generated src/xsnow
    - sed -i '1s/^xsnow\.extensions\.//' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.io\./io./' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.//' docs/api/_generated/*.rst || true
    - sed -i '/^Submodules$/,/^Module contents$/ { /^Module contents$/!d; }' docs/api/_generated/xsnow.io.rst || true
    - sed -i '/^Module contents$/,+2d' docs/api/_generated/xsnow.io.rst || true
    - jupyter-book build docs
    - rm -rf public
    - mkdir -p public
    - cp -a docs/_build/html/. public/
  pages:
    publish: public
    path_prefix: "$CI_COMMIT_TAG"
    expire_in: never
