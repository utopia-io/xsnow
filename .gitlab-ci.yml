stages:
  - lint
  - standard-install
  - gpu-install

variables:
  PIP_CACHE_DIR: ".cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  before_script:
    - python -V
    - python -m pip install --upgrade pip
    - pip --version
  cache:
    key: "${CI_JOB_NAME}-py${CI_IMAGE_TAG:-3.12}"
    paths:
      - .cache/pip
    policy: pull-push

########################################
# lint                                 #
########################################
type-mypy:
  stage: lint
  rules:
    - when: manual
  allow_failure: true
  script:
    - pip install ".[lint]"
    - mypy src/xsnow
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .mypy_cache/
    reports:
      dotenv: # none

lint-flake8:
  stage: lint
  rules:
    - when: manual
  allow_failure: true
  script:
    - pip install ".[lint]"
    - flake8 src tests

lint-pylint:
  stage: lint
  rules:
    - when: manual
  allow_failure: true
  script:
    - pip install ".[lint]"
    - pylint src/xsnow


########################################
# install+test                         #
########################################
pytest-cpu:
  stage: standard-install
  script:
    - pip install -e ".[testing]"
    - pytest -q --maxfail=1 --disable-warnings --junitxml=pytest-junit.xml --cov=xsnow --cov-report=xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pytest-gpu:
  stage: gpu-install
  tags: ["gpu"]
  image: nvidia/cuda:12.4.1-runtime-ubuntu22.04
  before_script:
    - apt-get update && apt-get install -y python3-pip python3-venv && rm -rf /var/lib/apt/lists/*
    - python3 -V
    - python3 -m pip install --upgrade pip
    - pip --version
  variables:
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    PIP_CACHE_DIR: ".cache/pip"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .cache/pip
    policy: pull-push
  script:
    # Install GPU extra; assumes your extras define cupy appropriately for the runner
    - pip install -e ".[gpu,testing]"
    - pytest -q -m "not slow" --maxfail=1 --disable-warnings --junitxml=pytest-gpu.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-gpu.xml
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
    # if GPU runners are not scarce --> when: on_success
