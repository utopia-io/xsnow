stages:
  - lint
  - standard-install
  - gpu-install
  - docs

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - when: never

variables:
  GIT_DEPTH: "0"               # ensure setuptools-scm sees full history
  PIP_CACHE_DIR: ".cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  before_script:
    - python --version
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip --version
  cache:
    key: "${CI_JOB_NAME}-py${CI_IMAGE_TAG:-3.12}"
    paths:
      - .cache/pip
    policy: pull-push

########################################
# Lint (manual, non-blocking)
########################################
type-mypy:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - mypy src/xsnow
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ .mypy_cache/ ]

lint-flake8:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - flake8 src tests

lint-pylint:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - pylint src/xsnow

########################################
# CPU tests (always)
########################################
tests-cpu:
  stage: standard-install
  script:
    - pip install -e ".[testing]"
    - pytest -q --maxfail=3 --disable-warnings --junitxml=pytest-junit.xml --cov=xsnow --cov-report=xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

########################################
# GPU tests (manual, non-blocking)
########################################
tests-gpu:
  stage: gpu-install
  tags: ["gpu"]   # requires a runner with this tag
  image: nvidia/cuda:12.4.1-runtime-ubuntu22.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git python3-pip && rm -rf /var/lib/apt/lists/*
    - python3 --version
    - python3 -m pip install --upgrade pip
    - python3 -m pip --version
  variables:
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  cache:
    key: "${CI_JOB_NAME}"
    paths: [ .cache/pip ]
    policy: pull-push
  script:
    - python3 -m pip install -e ".[gpu,testing]"
    - pytest -q -m "not slow" --maxfail=3 --disable-warnings --junitxml=pytest-gpu.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-gpu.xml
  rules: [ { when: manual } ]
  allow_failure: true

########################################
# Docs build template
########################################
.default-docs: &default-docs
  image: python:3.12-slim
  stage: docs
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - pip install -e .
  cache:
    key: "pip-docs"
    paths: [ .cache/pip ]
    policy: pull-push
  artifacts:
    paths: [ public ]
    expire_in: 360 days

# Helper pattern for all docs jobs:
# 0. Work out DOC_LABEL using setuptools-scm (for branches) or tag (for releases)
# 1. Inject DOC_LABEL into docs/index.md (ENV_DOC_VERSION -> DOC_LABEL)
#    (and into docs/_config.yml if that placeholder exists, harmless if not)
# 2. Build with jupyter-book
# 3. Copy to public/<dest>/
# 4. Generate:
#    - public/index.html      (redirect to /stable/)
#    - public/versionpicker/index.html  (list all dirs currently in public/)
#
# This runs in all three jobs so any job can regenerate both pages.

########################################
# Docs from default branch  -> /stable/
########################################
docs-stable:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    # 0. Figure out version string via setuptools-scm
    - export XSNOW_VERSION=$(python -c "import xsnow; print(xsnow.__version__)")
    - export DOC_LABEL="stable (${XSNOW_VERSION})"

    # 1. Inject DOC_LABEL
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true

    # 2. Build docs
    - sphinx-apidoc -f -e -o docs/api src/xsnow
    - jupyter-book build docs

    # 3. Copy to /stable/
    - mkdir -p public/stable
    - cp -r docs/_build/html/* public/stable/

    # 4. Create root index.html with fallback logic
    - |
      mkdir -p public
      if [ -d public/stable ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./stable/">' \
          '<link rel="canonical" href="./stable/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./stable/">stable</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      elif [ -d public/dev ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./dev/">' \
          '<link rel="canonical" href="./dev/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./dev/">dev</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      else
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<title>xsnow documentation</title>' \
          '<h1>xsnow documentation</h1>' \
          '<p>No built documentation folders are currently available.</p>' \
          > public/index.html
      fi

    # 5. Create /versionpicker/ listing what's actually present
    - |
      mkdir -p public/versionpicker
      {
        echo '<!doctype html><meta charset="utf-8">';
        echo '<title>xsnow documentation versions</title>';
        echo '<h1>xsnow documentation versions</h1>';
        echo '<ul>';
        if [ -d public/stable ]; then
          echo '  <li><a href="../stable/">stable</a> (default)</li>';
        fi
        if [ -d public/dev ]; then
          echo '  <li><a href="../dev/">dev</a> (bleeding edge)</li>';
        fi
        for d in public/*/ ; do
          bn=$(basename "$d" /)
          if [ "$bn" != "stable" ] && [ "$bn" != "dev" ] && [ "$bn" != "versionpicker" ]; then
            echo "  <li><a href=\"../${bn}/\">${bn}</a></li>";
          fi
        done
        echo '</ul>';
        echo '<p>Tip: You can directly visit /stable/, /dev/, or /vX.Y.Z/ (tagged releases).';
        echo ' During early development, /dev/ may be the only one available.</p>';
      } > public/versionpicker/index.html


########################################
# Docs from dev branch -> /dev/
########################################
docs-dev:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always             # <-- run even if tests failed
  allow_failure: true          # <-- don't block pipeline if this fails
  script:
    # 0. Figure out version label from setuptools-scm
    - export XSNOW_VERSION=$(python -c "import xsnow; print(xsnow.__version__)")
    - export DOC_LABEL="dev (${XSNOW_VERSION})"

    # 1. Inject DOC_LABEL
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true

    # 2. Build docs (even if code's a bit broken, build might still succeed)
    - sphinx-apidoc -f -e -o docs/api src/xsnow
    - jupyter-book build docs || true

    # 3. Copy to /dev/ (only if build produced output)
    - mkdir -p public/dev
    - if [ -d docs/_build/html ]; then cp -r docs/_build/html/* public/dev/; fi

    # 4. Create root index.html with fallback logic
    - |
      mkdir -p public
      if [ -d public/stable ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./stable/">' \
          '<link rel="canonical" href="./stable/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./stable/">stable</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      elif [ -d public/dev ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./dev/">' \
          '<link rel="canonical" href="./dev/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./dev/">dev</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      else
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<title>xsnow documentation</title>' \
          '<h1>xsnow documentation</h1>' \
          '<p>No built documentation folders are currently available.</p>' \
          > public/index.html
      fi

    # 5. Create /versionpicker/ listing what's actually present
    - |
      mkdir -p public/versionpicker
      {
        echo '<!doctype html><meta charset="utf-8">';
        echo '<title>xsnow documentation versions</title>';
        echo '<h1>xsnow documentation versions</h1>';
        echo '<ul>';
        if [ -d public/stable ]; then
          echo '  <li><a href="../stable/">stable</a> (default)</li>';
        fi
        if [ -d public/dev ]; then
          echo '  <li><a href="../dev/">dev</a> (bleeding edge)</li>';
        fi
        for d in public/*/ ; do
          bn=$(basename "$d" /)
          if [ "$bn" != "stable" ] && [ "$bn" != "dev" ] && [ "$bn" != "versionpicker" ]; then
            echo "  <li><a href=\"../${bn}/\">${bn}</a></li>";
          fi
        done
        echo '</ul>';
        echo '<p>Tip: You can directly visit /stable/, /dev/, or /vX.Y.Z/ (tagged releases).';
        echo ' During early development, /dev/ may be the only one available.</p>';
      } > public/versionpicker/index.html


########################################
# Docs from git tag (release) -> /<tag>/
########################################
docs-tagged:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success          # only publish tagged docs if pipeline is green
  script:
    # 0. Use the tag literally, e.g. v1.2.3
    - export DOC_LABEL="${CI_COMMIT_TAG}"

    # 1. Inject DOC_LABEL
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true

    # 2. Build docs
    - sphinx-apidoc -f -e -o docs/api src/xsnow
    - jupyter-book build docs

    # 3. Copy to /<tag>/
    - mkdir -p "public/${CI_COMMIT_TAG}"
    - cp -r docs/_build/html/* "public/${CI_COMMIT_TAG}/"

    # 4. Create root index.html with fallback logic
    - |
      mkdir -p public
      if [ -d public/stable ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./stable/">' \
          '<link rel="canonical" href="./stable/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./stable/">stable</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      elif [ -d public/dev ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./dev/">' \
          '<link rel="canonical" href="./dev/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./dev/">dev</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      else
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<title>xsnow documentation</title>' \
          '<h1>xsnow documentation</h1>' \
          '<p>No built documentation folders are currently available.</p>' \
          > public/index.html
      fi

    # 5. Create /versionpicker/ listing what's actually present
    - |
      mkdir -p public/versionpicker
      {
        echo '<!doctype html><meta charset="utf-8">';
        echo '<title>xsnow documentation versions</title>';
        echo '<h1>xsnow documentation versions</h1>';
        echo '<ul>';
        if [ -d public/stable ]; then
          echo '  <li><a href="../stable/">stable</a> (default)</li>';
        fi
        if [ -d public/dev ]; then
          echo '  <li><a href="../dev/">dev</a> (bleeding edge)</li>';
        fi
        for d in public/*/ ; do
          bn=$(basename "$d" /)
          if [ "$bn" != "stable" ] && [ "$bn" != "dev" ] && [ "$bn" != "versionpicker" ]; then
            echo "  <li><a href=\"../${bn}/\">${bn}</a></li>";
          fi
        done
        echo '</ul>';
        echo '<p>Tip: You can directly visit /stable/, /dev/, or /vX.Y.Z/ (tagged releases).';
        echo ' During early development, /dev/ may be the only one available.</p>';
      } > public/versionpicker/index.html


########################################
# Publish GitLab Pages
########################################
pages:
  stage: docs
  needs:
    - job: docs-stable
      optional: true
    - job: docs-dev
      optional: true
    - job: docs-tagged
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always  # publish even on failure (docs-dev allowed to fail gracefully)
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  allow_failure: true  # helpful for dev
  script:
    - echo "Publishing GitLab Pages artifacts"
  artifacts:
    paths: [ public ]
