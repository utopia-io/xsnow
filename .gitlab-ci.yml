          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./dev/">dev</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      else
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<title>xsnow documentation</title>' \
          '<h1>xsnow documentation</h1>' \
          '<p>No built documentation folders are currently available.</p>' \
          > public/index.html
      fi
    - |
      mkdir -p public/versionpicker
      {
        echo '<!doctype html><meta charset="utf-8">';
        echo '<title>xsnow documentation versions</title>';
        echo '<h1>xsnow documentation versions</h1>';
        echo '<ul>';
        if [ -d public/stable ]; then
          echo '  <li><a href="../stable/">stable</a> (default)</li>';
        fi
        if [ -d public/dev ]; then
          echo '  <li><a href="../dev/">dev</a> (bleeding edge)</li>';
        fi
        for d in public/*/ ; do
          bn=$(basename "$d" /)
          if [ "$bn" != "stable" ] && [ "$bn" != "dev" ] && [ "$bn" != "versionpicker" ]; then
            echo "  <li><a href=\"../${bn}/\">${bn}</a></li>";
          fi
        done
        echo '</ul>';
        echo '<p>Tip: You can directly visit /stable/, /dev/, or /vX.Y.Z/ (tagged releases).';
        echo ' During early development, /dev/ may be the only one available.</p>';
      } > public/versionpicker/index.html

########################################
# Docs from git tag (release) -> /<tag>/
########################################
docs-tagged:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  script:
    - export DOC_LABEL="${CI_COMMIT_TAG}"
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true
    - echo "Generating API docs…"
    - rm -rf docs/api/_generated || true
    - mkdir -p docs/api/_generated
    - sphinx-apidoc -f -e -o docs/api/_generated src/xsnow
    - sed -i '1s/^xsnow\.extensions\.//' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.//' docs/api/_generated/*.rst || true
    - jupyter-book build docs
    - mkdir -p "public/${CI_COMMIT_TAG}"
    - cp -r docs/_build/html/* "public/${CI_COMMIT_TAG}/"
    - |
      mkdir -p public
      if [ -d public/stable ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./stable/">' \
          '<link rel="canonical" href="./stable/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./stable/">stable</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      elif [ -d public/dev ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./dev/">' \
          '<link rel="canonical" href="./dev/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./dev/">dev</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      else
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<title>xsnow documentation</title>' \
          '<h1>xsnow documentation</h1>' \
          '<p>No built documentation folders are currently available.</p>' \
          > public/index.html
      fi
    - |
      mkdir -p public/versionpicker
      {
        echo '<!doctype html><meta charset="utf-8">';
        echo '<title>xsnow documentation versions</title>';
        echo '<h1>xsnow documentation versions</h1>';
        echo '<ul>';
        if [ -d public/stable ]; then
          echo '  <li><a href="../stable/">stable</a> (default)</li>';
        fi
        if [ -d public/dev ]; then
          echo '  <li><a href="../dev/">dev</a> (bleeding edge)</li>';
        fi
        for d in public/*/ ; do
          bn=$(basename "$d" /)
          if [ "$bn" != "stable" ] && [ "$bn" != "dev" ] && [ "$bn" != "versionpicker" ]; then
            echo "  <li><a href=\"../${bn}/\">${bn}</a></li>";
          fi
        done
        echo '</ul>';
        echo '<p>Tip: You can directly visit /stable/, /dev/, or /vX.Y.Z/ (tagged releases).';
        echo ' During early development, /dev/ may be the only one available.</p>';
      } > public/versionpicker/index.html

########################################
# Publish GitLab Pages
########################################
pages:
  stage: docs
  needs:
    - job: docs-stable
      optional: true
    - job: docs-dev
      optional: true
    - job: docs-tagged
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  allow_failure: true
  script:
    - echo "Publishing GitLab Pages artifacts"
  artifacts:
    paths: [ public ]