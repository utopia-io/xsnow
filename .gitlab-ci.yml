stages:
  - lint
  - standard-install
  - gpu-install
  - performance      # ← NEW: Performance testing stage
  - docs

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - when: never

variables:
  GIT_DEPTH: "0"               # ensure setuptools-scm sees full history
  PIP_CACHE_DIR: ".cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  before_script:
    - python --version
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip --version
  cache:
    key: "${CI_JOB_NAME}-py${CI_IMAGE_TAG:-3.12}"
    paths:
      - .cache/pip
    policy: pull-push

########################################
# Lint (manual, non-blocking)
########################################
type-mypy:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - mypy src/xsnow
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ .mypy_cache/ ]

lint-flake8:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - flake8 src tests

lint-pylint:
  stage: lint
  rules: [ { when: manual } ]
  allow_failure: true
  script:
    - pip install ".[lint]"
    - pylint src/xsnow

########################################
# CPU tests (always)
########################################
tests-cpu:
  stage: standard-install
  script:
    - pip install -e ".[testing]"
    - pytest -v --maxfail=3 --disable-warnings 
        --junitxml=pytest-junit.xml 
        --cov=xsnow 
        --cov-report=xml
        --ignore=tests/performance/  # Exclude slow performance tests
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

########################################
# GPU tests (manual, non-blocking)
########################################
tests-gpu:
  stage: gpu-install
  tags: ["gpu"]   # requires a runner with this tag
  image: nvidia/cuda:12.4.1-runtime-ubuntu22.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git python3-pip && rm -rf /var/lib/apt/lists/*
    - python3 --version
    - python3 -m pip install --upgrade pip
    - python3 -m pip --version
  variables:
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  cache:
    key: "${CI_JOB_NAME}"
    paths: [ .cache/pip ]
    policy: pull-push
  script:
    - python3 -m pip install -e ".[gpu,testing]"
    - pytest -q -m "not slow" --maxfail=3 --disable-warnings --junitxml=pytest-gpu.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: pytest-gpu.xml
  rules: [ { when: manual } ]
  allow_failure: true

########################################
# Performance: Quick Benchmarks (Auto)
########################################
performance-quick:
  stage: performance
  cache:
    key: "performance-${CI_JOB_NAME}"
    paths:
      - .cache/pip
      - .benchmarks/
    policy: pull-push
  script:
    - pip install -e ".[testing]"
    - pytest tests/performance/ --benchmark-only -m "not slow" 
        --benchmark-json=benchmark-results.json
        --benchmark-columns=min,max,mean,stddev,median
        -v
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - benchmark-results.json
      - .benchmarks/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feat\/.*/  # Run on feature branches

########################################
# Performance: Regression Check (MR)
########################################
performance-regression-check:
  stage: performance
  cache:
    key: "performance-baseline"
    paths:
      - .cache/pip
      - .benchmarks/
    policy: pull
  script:
    - pip install -e ".[testing]"
    - |
      echo "Checking for performance regressions..."
      if [ -d ".benchmarks" ] && [ "$(ls -A .benchmarks)" ]; then
        echo "✓ Baseline found, comparing..."
        pytest tests/performance/ --benchmark-only -m "not slow" \
          --benchmark-compare=0001 \
          --benchmark-compare-fail=mean:20% \
          --benchmark-json=comparison.json \
          -v || {
            echo "⚠️  Performance regression detected (>20% slower)"
            echo "Review the output above for details"
            exit 1
          }
        echo "✓ No significant regressions"
      else
        echo "⚠️  No baseline - saving current as baseline"
        pytest tests/performance/ --benchmark-only -m "not slow" \
          --benchmark-save=baseline -v
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - comparison.json
      - .benchmarks/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feat\/.*/  # Optional: test on feature branches
      when: manual
  allow_failure: true

########################################
# Performance: Save Baseline (Main)
########################################
performance-save-baseline:
  stage: performance
  cache:
    key: "performance-baseline"
    paths:
      - .cache/pip
      - .benchmarks/
    policy: pull-push
  script:
    - pip install -e ".[testing]"
    - pytest tests/performance/ --benchmark-only -m "not slow" \
        --benchmark-save=baseline \
        --benchmark-json=baseline-results.json \
        -v
    - echo "✓ Baseline saved for future comparisons"
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - baseline-results.json
      - .benchmarks/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

########################################
# Performance: Full Suite (Manual)
########################################
performance-full:
  stage: performance
  cache:
    key: "performance-full"
    paths:
      - .cache/pip
    policy: pull-push
  script:
    - pip install -e ".[testing]"
    - pytest tests/performance/ --benchmark-only \
        --benchmark-json=full-benchmark-results.json \
        --benchmark-columns=all \
        -v -s
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - full-benchmark-results.json
  rules:
    - when: manual
  allow_failure: true

########################################
# Performance: Memory Profiling (Manual)
########################################
performance-memory:
  stage: performance
  cache:
    key: "performance-memory"
    paths:
      - .cache/pip
    policy: pull-push
  script:
    - pip install -e ".[testing]"
    - pytest tests/performance/ -v -s -m memprof
  rules:
    - when: manual
  allow_failure: true

########################################
# Performance: Parser Comparison (Manual)
########################################
performance-parser:
  stage: performance
  cache:
    key: "performance-parser"
    paths:
      - .cache/pip
    policy: pull-push
  script:
    - pip install -e ".[testing]"
    - |
      if [ -f "tests/performance/test_pro_parser_readlines_vs_generator.py" ]; then
        pytest tests/performance/test_pro_parser_readlines_vs_generator.py -v -s
      else
        pytest tests/performance/test_parser_optimization_example.py -v -s
      fi
  rules:
    - when: manual
  allow_failure: true

########################################
# Docs build template
########################################
.default-docs: &default-docs
  image: python:3.12-slim
  stage: docs
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - pip install -e .
  cache:
    key: "pip-docs"
    paths: [ .cache/pip ]
    policy: pull-push
  artifacts:
    paths: [ public ]
    expire_in: 360 days

########################################
# Docs from default branch  -> /stable/
########################################
docs-stable:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    - export XSNOW_VERSION=$(python -c "import xsnow; print(xsnow.__version__)")
    - export DOC_LABEL="stable (${XSNOW_VERSION})"
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true
    - echo "Generating API docs…"
    - rm -rf docs/api/_generated || true
    - mkdir -p docs/api/_generated
    - sphinx-apidoc -f -e -o docs/api/_generated src/xsnow
    - sed -i '1s/^xsnow\.extensions\.//' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.//' docs/api/_generated/*.rst || true
    - jupyter-book build docs
    - mkdir -p public/stable
    - cp -r docs/_build/html/* public/stable/
    - |
      mkdir -p public
      if [ -d public/stable ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./stable/">' \
          '<link rel="canonical" href="./stable/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./stable/">stable</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      elif [ -d public/dev ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./dev/">' \
          '<link rel="canonical" href="./dev/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./dev/">dev</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
          > public/index.html
      else
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<title>xsnow documentation</title>' \
          '<h1>xsnow documentation</h1>' \
          '<p>No built documentation folders are currently available.</p>' \
          > public/index.html
      fi
    - |
      mkdir -p public/versionpicker
      {
        echo '<!doctype html><meta charset="utf-8">';
        echo '<title>xsnow documentation versions</title>';
        echo '<h1>xsnow documentation versions</h1>';
        echo '<ul>';
        if [ -d public/stable ]; then
          echo '  <li><a href="../stable/">stable</a> (default)</li>';
        fi
        if [ -d public/dev ]; then
          echo '  <li><a href="../dev/">dev</a> (bleeding edge)</li>';
        fi
        for d in public/*/ ; do
          bn=$(basename "$d" /)
          if [ "$bn" != "stable" ] && [ "$bn" != "dev" ] && [ "$bn" != "versionpicker" ]; then
            echo "  <li><a href=\"../${bn}/\">${bn}</a></li>";
          fi
        done
        echo '</ul>';
        echo '<p>Tip: You can directly visit /stable/, /dev/, or /vX.Y.Z/ (tagged releases).';
        echo ' During early development, /dev/ may be the only one available.</p>';
      } > public/versionpicker/index.html

########################################
# Docs from dev branch -> /dev/
########################################
docs-dev:
  <<: *default-docs
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
  allow_failure: true
  script:
    - rm -rf public/latest || true
    - export XSNOW_VERSION=$(python -c "import xsnow; print(xsnow.__version__)")
    - export DOC_LABEL="dev (${XSNOW_VERSION})"
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/index.md
    - sed -i "s/ENV_DOC_VERSION/${DOC_LABEL}/" docs/_config.yml || true
    - echo "Generating API docs…"
    - rm -rf docs/api/_generated || true
    - mkdir -p docs/api/_generated
    - sphinx-apidoc -f -e -o docs/api/_generated src/xsnow
    - sed -i '1s/^xsnow\.extensions\.//' docs/api/_generated/*.rst || true
    - sed -i '1s/^xsnow\.//' docs/api/_generated/*.rst || true
    - jupyter-book build docs || true
    - mkdir -p public/dev
    - if [ -d docs/_build/html ]; then cp -r docs/_build/html/* public/dev/; fi
    - |
      mkdir -p public
      if [ -d public/stable ]; then
        printf '%s\n' \
          '<!doctype html>' \
          '<meta charset="utf-8">' \
          '<meta http-equiv="refresh" content="0; url=./stable/">' \
          '<link rel="canonical" href="./stable/">' \
          '<title>Redirecting…</title>' \
          '<p>Redirecting to <a href="./stable/">stable</a> docs…</p>' \
          '<p>Looking for other versions? See <a href="./versionpicker/">version picker</a>.</p>' \
