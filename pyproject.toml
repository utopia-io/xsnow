[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsnow"
dynamic = ["version"]
description = "A collaborative Python package for parsing and post-processing snow cover simulations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Florian Herla", email = "fherla@sfu.ca" },
  { name = "Ron Simenhois", email = "ron.simenhois@state.co.us" },
]
dependencies = [
    "netcdf4>=1.7.2",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "xarray>=2025.7.1",
    "scipy>=1.16.1",
    "bottleneck>=1.5.0",
    "pooch",
    "tzdata>=2024.1",
    "pytest>=8.4.2",
    "dask>=2025.9.1",
]
keywords = ["snow", "stratigraphy", "avalanche", "xarray", "post-processing"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
testing = [
  "pytest>=8.0",
  "pytest-cov",
  "psutil>=7.1.0",
  "pytest-benchmark>=5.1.0",
  "memory-profiler>=0.61.0",
  "pytest-timeout>=2.4.0",
]
gpu = [
  "cupy-cuda12x; platform_system == 'Linux'",  # nvidia wheels
]
lint = [
  "mypy>=1.6",
  "flake8>=6",
  "pylint>=3",
]
dev = [
  "matplotlib>=3.8",
  "ipython",
  "jupyter",
  "ruamel.yaml>=0.18",
]
release = [
  "ruamel.yaml>=0.18",
  "cffconvert>=2.0.0",
]

[project.urls]
"Homepage"      = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Documentation" = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Repository"    = "https://gitlab.com/avacollabra/postprocessing/xsnow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
write_to = "src/xsnow/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
timeout = 300  # Kill any test taking longer than 5 minutes
timeout_method = "thread"
testpaths = ["tests"]
norecursedirs = ["tests_backup"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "real_data: marks tests that use real data files",
    "synthetic: marks tests that use synthetic data",
    "edge_case: marks edge case tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:multiprocessing",
]
