[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsnow"
dynamic = ["version"]
description = "A collaborative Python package for parsing and post-processing snow cover simulations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Ron Simenhois", email = "ron.simenhois@state.co.us" },
  { name = "Florian Herla", email = "fherla@sfu.ca" },
]
dependencies = [
    "netcdf4>=1.7.2",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "xarray>=2025.7.1",
    "scipy>=1.16.1",
    "bottleneck>=1.5.0",
    "pooch",
]
keywords = ["snow", "stratigraphy", "avalanche", "xarray", "post-processing"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
testing = [
  "pytest>=7.0",
  "pytest-cov",
]
gpu = [
  "cupy-cuda12x; platform_system == 'Linux'",  # nvidia wheels
]
lint = [
  "mypy>=1.6",
  "flake8>=6",
  "pylint>=3",
]
dev = [
  "matplotlib>=3.8",
  "ipython",
  "jupyter",
]

[project.urls]
"Homepage"      = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Documentation" = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Repository"    = "https://gitlab.com/avacollabra/postprocessing/xsnow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
write_to = "src/xsnow/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
