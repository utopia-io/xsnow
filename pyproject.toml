[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsnow"
version = "0.0.1"
description = "A collaborative Python package for parsing and post-processing snow cover simulations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Ron Simenhois", email = "ron.simenhois@state.co.us" },
  { name = "Florian Herla", email = "fherla@sfu.ca" },
]
dependencies = [
    "cupy>=13.5.1",
    "netcdf4>=1.7.2",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "xarray>=2025.7.1",
    "scipy>=1.16.1",
]
keywords = ["snow", "avalanche", "xarray", "post-processing"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
testing = [
  "pytest>=7.0",
  "pytest-cov",
  "cupy-cuda12x; platform_system == 'Linux'", # Example for GPU support on Linux
]

[project.urls]
"Homepage"      = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Documentation" = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Repository"    = "https://gitlab.com/avacollabra/postprocessing/xsnow"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.5",
]

[tool.setuptools]
package-dir = {"" = "src"}
