[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsnow"
dynamic = ["version"]
description = "A collaborative Python package for parsing and post-processing snow cover simulations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Florian Herla", email = "fherla@sfu.ca" },
  { name = "Ron Simenhois", email = "ron.simenhois@state.co.us" },
]
dependencies = [
    "netcdf4>=1.7.2",
    "numpy>=2.3.2",
    "pandas>=2.3.1, <4",
    "xarray>=2025.7.1",
    "scipy>=1.16.1",
    "bottleneck>=1.5.0",
    "pooch>=1.9.0",
    "tzdata>=2024.1",
    "pytest>=8.4.2",
    "dask>=2025.9.1",
    "matplotlib>=3.10.6",
    "folium>=0.20.0",
    "zarr>=3.1.5",
    "psutil>=7.1.0",
]

keywords = ["snow", "stratigraphy", "avalanche", "xarray", "post-processing"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
testing = [
  "pytest>=8.0",
  "pytest-cov",
  "pytz>=2024.1",
  "psutil>=7.1.0",
  "pytest-benchmark>=5.1.0",
  "memory-profiler>=0.61.0",
  "pytest-timeout>=2.4.0",
]
gpu = [
  "cupy-cuda12x; platform_system == 'Linux'",  # nvidia wheels
]
viz = [
  "plotly>=5.0",  # interactive plots (e.g. extensions.season_plot)
  "nivix @ git+https://gitlab.com/avalanche-warning/visualization/nivix.git",
]
lint = [
  "mypy>=1.6",
  "flake8>=6",
  "pylint>=3",
]
dev = [
  "matplotlib>=3.8",
  "ipython",
  "jupyter",
  "ruamel.yaml>=0.18",
]
release = [
  "ruamel.yaml>=0.18",
  "cffconvert>=2.0.0",
]
# NEW: Large-scale data management features
largescale = [
  "dask[distributed]>=2025.9.1",  # Distributed processing (note: dask is already in core deps)
  "psutil>=7.1.0",                # Memory monitoring (note: psutil is in testing deps)
]

# uv dependency groups (PEP 735): installed by uv sync, not published with the
# package. The `test` group mirrors the `testing` optional-dependencies extra,
# which is kept for pip/CI (pip install -e ".[testing]"). Keep the two in sync.
[dependency-groups]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "pytz>=2024.1",
  "psutil>=7.1.0",
  "pytest-benchmark>=5.1.0",
  "memory-profiler>=0.61.0",
  "pytest-timeout>=2.4.0",
]

[tool.uv]
default-groups = ["test"]

[project.urls]
"Homepage"      = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Documentation" = "https://gitlab.com/avacollabra/postprocessing/xsnow"
"Repository"    = "https://gitlab.com/avacollabra/postprocessing/xsnow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
xsnow = ["py.typed", "*.pyi", "resources/*.mplstyle"]

[tool.setuptools_scm]
write_to = "src/xsnow/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
timeout = 300  # Kill any test taking longer than 5 minutes
timeout_method = "thread"
testpaths = ["tests"]
norecursedirs = ["tests_backup"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "real_data: marks tests that use real data files",
    "synthetic: marks tests that use synthetic data",
    "edge_case: marks edge case tests",
    "largescale: marks large-scale data management tests",  # NEW marker
]
filterwarnings = [
    "ignore::DeprecationWarning:multiprocessing",
    # Zarr v3 maturity warnings: fixed-length string dtype has no stable v3
    # spec yet, and consolidated metadata isn't part of the v3 spec. Both are
    # benign for xsnow's round-trip usage.
    "ignore::zarr.errors.UnstableSpecificationWarning",
    "ignore::zarr.errors.ZarrUserWarning",
]
